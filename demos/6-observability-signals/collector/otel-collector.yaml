apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: demo-mantis
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.94.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 9464
              name: prometheus
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: demo-mantis
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 9464
      targetPort: 9464
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: demo-mantis
  labels:
    app: otel-collector
    guardian.dev/demo: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
      attributes/add-falco-labels:
        actions:
          - key: guardian.security.alert
            value: true
            action: upsert
          - key: guardian.alert.source
            value: falco
            action: insert
    exporters:
      debug:
        verbosity: detailed
      prometheus:
        endpoint: 0.0.0.0:9464
        # Keep the metric name as http_server_duration (no _milliseconds suffix)
        # so the dashboard query http_server_duration_bucket resolves.
        add_metric_suffixes: false
        # Promote resource attributes (service.name) to labels so the
        # dashboard's service_name="guardian-telemetry" filter matches.
        resource_to_telemetry_conversion:
          enabled: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, prometheus]
        logs:
          receivers: [otlp]
          processors: [batch, attributes/add-falco-labels]
          exporters: [debug]
